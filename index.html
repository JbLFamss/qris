<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRIS Statis → Dinamis</title>
<style nonce="JU4WuA5UTE660nFtwyAxlg==">
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f3f5f9;margin:0;padding:16px;color:#1d2433}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 16px;color:#667;font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd;border-radius:10px;font-size:15px}
textarea{font-family:monospace;font-size:12px;height:70px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#c8102e;color:#fff;font-size:16px;font-weight:600;margin-top:16px;cursor:pointer}
button.sec{background:#1d2433}
.msg{font-size:13px;margin-top:8px}.ok{color:#0a7a3b}.err{color:#c8102e}
#out{text-align:center;margin-top:18px;display:none}#qr img{width:260px;height:260px;image-rendering:pixelated}
.info{font-size:13px;background:#f6f7fb;border-radius:10px;padding:10px;margin-top:10px;text-align:left}
small{color:#889}

<body>
<div class="card">
<h1>QRIS Statis → Dinamis</h1>
<p class="sub">Semua proses berjalan di browser Anda. Data tidak dikirim ke mana pun.</p>

<label>1. Unggah gambar QRIS statis</label>
<input type="file" id="file" accept="image/*">
<label>atau tempel kode QRIS</label>
<textarea id="raw" placeholder="000201010211..."></textarea>
<div id="m1" class="msg"></div>
<button class="sec" id="save">Simpan QRIS di browser ini</button>

<label>2. Nominal (Rp)</label>
<input type="number" id="amt" min="1" placeholder="contoh: 25000">

<label>Biaya layanan (opsional)</label>
<div class="row">
<select id="feeType"><option value="">Tanpa biaya</option><option value="fix">Tetap (Rp)</option><option value="pct">Persen (%)</option></select>
<input type="number" id="fee" step="0.01" placeholder="0">
</div>

<button id="go">Buat QRIS Dinamis</button>
<div id="m2" class="msg"></div>

<div id="out">
<div id="qr"></div>
<div class="info" id="det"></div>
<button class="sec" id="dl">Unduh PNG</button>
<small>Uji dulu dengan nominal kecil sebelum dipakai ke pelanggan.</small>
</div>
</div>

<script>

const QR=(function(){
const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
const NB=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
function dataCw(v){return Math.floor(rawMods(v)/8)-ECC[v]*NB[v]}
function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
function alignPos(v,size){if(v==1)return[];const n=Math.floor(v/7)+2;const step=v==32?26:Math.ceil((v*4+4)/(n*2-2))*2;const r=[6];for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r}
function encode(text){
const bytes=Array.from(new TextEncoder().encode(text));let v=1;
for(;v<=40;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCw(v)*8)break}
if(v>40)throw'Data terlalu panjang untuk QR';
const cap=dataCw(v)*8,bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
const dc=[];for(let i=0;i<bits.length;i+=8)dc.push(parseInt(bits.slice(i,i+8).join(''),2));
const nb=NB[v],eb=ECC[v],raw=Math.floor(rawMods(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(eb),blocks=[];
for(let i=0,k=0;i<nb;i++){const dat=dc.slice(k,k+sl-eb+(i<ns?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<ns)dat.push(0);blocks.push(dat.concat(ec))}
const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-eb||j>=ns)all.push(b[i])});
const size=v*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
for(let i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!=2&&d!=4)}};
finder(3,3);finder(size-4,3);finder(3,size-4);
const ap=alignPos(v,size);ap.forEach((a,i)=>ap.forEach((b,j)=>{if(!((i==0&&j==0)||(i==0&&j==ap.length-1)||(i==ap.length-1&&j==0)))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}));
const fmt=m=>{const d=(0<<3)|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!=0;
for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
fmt(0);
if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!=0,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bt);set(c,a,bt)}}
let i=0;for(let right=size-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?size-1-vert:vert;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!=0;i++}}}
const mask=(m)=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++){let inv;switch(m){case 0:inv=(x+y)%2==0;break;case 1:inv=y%2==0;break;case 2:inv=x%3==0;break;case 3:inv=(x+y)%3==0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;case 5:inv=x*y%2+x*y%3==0;break;case 6:inv=(x*y%2+x*y%3)%2==0;break;default:inv=((x+y)%2+x*y%3)%2==0}if(!F[y][x]&&inv)M[y][x]=!M[y][x]}};
const penalty=()=>{let p=0;for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]==M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]==M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c==M[y][x+1]&&c==M[y+1][x]&&c==M[y+1][x+1])p+=3}
let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
let best=0,bp=1e9;for(let m=0;m<8;m++){mask(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m}mask(m)}
mask(best);fmt(best);return M}
function toCanvas(text,scale,border){const M=encode(text),n=M.length,c=document.createElement('canvas');c.width=c.height=(n+border*2)*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let i=0;i<n;i++)if(M[y][i])x.fillRect((i+border)*scale,(y+border)*scale,scale,scale);return c}
return{encode,toCanvas}})();

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function parse(s){const t=[];let i=0;while(i<s.length){const tag=s.substr(i,2),len=parseInt(s.substr(i+2,2),10);if(isNaN(len))throw'Format QRIS rusak';t.push({tag,val:s.substr(i+4,len)});i+=4+len}return t}
function tlv(tag,v){return tag+String(v.length).padStart(2,'0')+v}
function validate(s){s=s.trim();if(!s.startsWith('000201'))throw'Bukan kode QRIS yang valid';const body=s.slice(0,-4);if(crc16(body)!==s.slice(-4).toUpperCase())throw'Checksum QRIS asli tidak cocok';return s}
function merchant(t){const n=t.find(x=>x.tag==='59'),c=t.find(x=>x.tag==='60');return (n?n.val:'?')+(c?' — '+c.val:'')}

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
if(!('BarcodeDetector' in window)){msg('m1','Browser ini belum bisa membaca QR dari gambar. Pindai QRIS dengan aplikasi scanner (mis. Google Lens), salin teksnya, lalu tempel di kolom di bawah.',1);return}
try{const bmp=await createImageBitmap(f);const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);if(r.length){$('raw').value=r[0].rawValue;check()}else msg('m1','QR tidak terbaca. Coba gambar yang lebih jelas atau crop area QR.',1)}catch(err){msg('m1','Gagal membaca gambar: '+err,1)}};
$('raw').oninput=check;
function msg(id,t,e){$(id).textContent=t;$(id).className='msg '+(e?'err':'ok')}
function check(){try{const s=validate($('raw').value);msg('m1','QRIS terbaca: '+merchant(parse(s)))}catch(e){if($('raw').value.trim())msg('m1',e,1)}}
$('save').onclick=()=>{try{const v=validate($('raw').value);if(store.set('qris_statis',v))msg('m1','QRIS tersimpan di browser ini.');else msg('m1','Penyimpanan tidak tersedia di tampilan ini. Akan berfungsi saat file dibuka langsung di browser.',1)}catch(e){msg('m1',e,1)}};
const saved=store.get('qris_statis');if(saved){$('raw').value=saved;check()}

$('go').onclick=()=>{try{
const s=validate($('raw').value);const amt=Math.round(Number($('amt').value));if(!amt||amt<1)throw'Masukkan nominal yang benar';
let t=parse(s.slice(0,-8)).filter(x=>!['54','55','56','57','63'].includes(x.tag));
t.forEach(x=>{if(x.tag==='01')x.val='12'});
t.push({tag:'54',val:String(amt)});
const ft=$('feeType').value,fv=Number($('fee').value);let feeTxt='-';
if(ft&&fv>0){if(ft==='fix'){t.push({tag:'55',val:'02'},{tag:'56',val:String(Math.round(fv))});feeTxt='Rp '+Math.round(fv).toLocaleString('id-ID')}else{t.push({tag:'55',val:'03'},{tag:'57',val:String(fv)});feeTxt=fv+'%'}}
t.sort((a,b)=>+a.tag-+b.tag);
let out=t.map(x=>tlv(x.tag,x.val)).join('')+'6304';out+=crc16(out);
const cv=QR.toCanvas(out,8,4);const im=new Image();im.src=cv.toDataURL('image/png');$('qr').innerHTML='';$('qr').appendChild(im);
$('det').innerHTML='<b>'+merchant(t)+'</b><br>Nominal: Rp '+amt.toLocaleString('id-ID')+'<br>Biaya layanan: '+feeTxt+'<br><small style="word-break:break-all">'+out+'</small>';
$('out').style.display='block';msg('m2','QRIS dinamis berhasil dibuat.');window.lastAmt=amt;
}catch(e){msg('m2',e,1)}};
$('dl').onclick=()=>{const i=$('qr').querySelector('img');const a=document.createElement('a');a.href=i.src;a.download='qris-'+(window.lastAmt||'')+'.png';a.click()};
</script>
